# Make hangs/panics easier to diagnose
# Needs efi_pstore enabled (see kernel cmdline) to capture oops/panic text.

# Detect hard lockups via the watchdog, panic on them so the trace is stored.
kernel.nmi_watchdog = 1
kernel.hardlockup_panic = 1

# A kernel oops (e.g. in amdgpu) otherwise leaves a half-working system with the
# evidence only in the journal, if that gets flushed. Panic instead so pstore
# captures it. The hardware watchdog then resets the machine ~30s later.
kernel.panic_on_oops = 1

# Deliberately NOT set: kernel.panic (auto-reboot). The panic text stays on the
# screen until the watchdog fires, so it can be photographed.
